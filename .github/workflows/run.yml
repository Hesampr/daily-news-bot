name: News Bot 📰

on:
  schedule:
   # 한국 시간 매일 오전 7:30 (UTC 기준 22:30)
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}                 # 선택: 뉴스레터 수집
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }} # 선택: 지메일 앱 비밀번호
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}       # 선택: LLM 리랭크
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}                # 선택: 기본 gemini-2.5-flash
          PYTHONUNBUFFERED: "1"
        run: python -u bot.py

      - name: Commit seen files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_news.txt seen_titles.txt
          git diff --staged --quiet || git commit -m "Update seen files [skip ci]"
          git push
